<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Private Access — NEXORA AI</title>
<link rel="icon" href="https://res.cloudinary.com/dqqyvozdw/image/upload/v1795167935/ymkqmxn7je9eeyiqtqel.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,system-ui,sans-serif;color:#f8fafc;background:radial-gradient(760px 460px at 12% 0%,rgba(139,92,246,.25),transparent 68%),radial-gradient(620px 400px at 100% 100%,rgba(34,211,238,.10),transparent 68%),#080b13}
.panel{width:min(100%,430px);padding:38px;border:1px solid rgba(178,160,255,.18);border-radius:26px;background:linear-gradient(145deg,rgba(20,26,42,.96),rgba(12,17,29,.96));box-shadow:0 30px 100px rgba(0,0,0,.48),0 0 55px rgba(124,92,255,.08);backdrop-filter:blur(22px)}
.brand{text-align:center;margin-bottom:28px}.brand img{width:72px;height:72px;border-radius:22px;object-fit:cover;box-shadow:0 0 34px rgba(139,92,246,.22);border:1px solid rgba(255,255,255,.12)}.brand h1{font-size:27px;letter-spacing:.4px;margin:16px 0 6px}.brand p{margin:0;color:#98a2b8;font-size:13px}
label{display:block;font-size:13px;color:#cbd5e1;margin:16px 0 7px}input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:#0b1020;color:#fff;font:inherit;outline:none}input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(139,92,246,.16)}
button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:13px;background:linear-gradient(120deg,#9B7BFF,#6650D5);color:#fff;font-weight:700;font-size:14px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{min-height:20px;margin:13px 0 0;color:#fca5a5;font-size:13px;text-align:center}.foot{text-align:center;margin-top:24px;color:#748199;font-size:10px;letter-spacing:.3px}
</style>
</head>
<body>
<main class="panel">
  <div class="brand">
    <img src="https://res.cloudinary.com/dqqyvozdw/image/upload/v1795167935/ymkqmxn7je9eeyiqtqel.png" alt="NEXORA">
    <h1>NEXORA AI</h1>
    <p>Private workspace · VEX Creative Designs</p>
  </div>
  <form id="loginForm">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submitBtn" type="submit">Sign in securely</button>
    <p class="error" id="error" role="alert"></p>
  </form>
  <div class="foot">Your Ideas. Your Code. Your Future.</div>
</main>
<script>
const form=document.getElementById('loginForm'),btn=document.getElementById('submitBtn'),err=document.getElementById('error');
form.addEventListener('submit',async e=>{
 e.preventDefault();btn.disabled=true;btn.textContent='Checking...';err.textContent='';
 try{
  const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value,password:form.password.value})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||'Sign in failed.');
  location.replace('/');
 }catch(error){err.textContent=error.message||'Unable to sign in. Please try again.';}
 finally{btn.disabled=false;btn.textContent='Sign in securely';}
});
</script>
</body>
</html>
