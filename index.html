<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NEXORA AI — by VEX Creative Designs</title>
<meta name="description" content="NEXORA AI — Your Ideas. Your Code. Your Future." />
<link rel="icon" href="https://res.cloudinary.com/dqqyvozdw/image/upload/v1795167935/ymkqmxn7je9eeyiqtqel.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
  :root {
    --accent: #8B5CF6;
    --accent-2: #22D3EE;
    --accent-soft: rgba(139, 92, 246, .12);
    --bg: #FBF7EF;
    --surface: #FFFDF8;
    --sidebar: #F4EEE1;
    --glass: rgba(251, 247, 239, .78);
    --border: #E9E1D0;
    --text: #1B1F33;
    --muted: #6B6F85;
    --user-bubble: #EFE8FB;
    --code-bg: #0B1020;
    --code-head: #171B2B;
    --code-text: #E6EAF5;
    --shadow: 0 8px 30px rgba(27, 31, 51, .08);
    --radius: 18px;
  }
  [data-theme="dark"] {
    --bg: #0B1020;
    --surface: #171B2B;
    --sidebar: #0E1428;
    --glass: rgba(11, 16, 32, .72);
    --border: rgba(255, 255, 255, .08);
    --text: #F8FAFC;
    --muted: #98A2B8;
    --user-bubble: rgba(139, 92, 246, .24);
    --code-bg: #070B16;
    --shadow: 0 8px 30px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(600px 300px at 85% -5%, rgba(139, 92, 246, .14), transparent 70%),
      radial-gradient(500px 280px at 10% 105%, rgba(34, 211, 238, .10), transparent 70%);
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  .app { position: relative; z-index: 1; display: flex; height: 100dvh; }

  /* Avatar */
  .avatar {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-weight: 800; position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.fb::after { content: attr(data-letter); }
  .avatar.sm { width: 36px; height: 36px; font-size: 16px; box-shadow: 0 0 0 2px var(--accent-soft); }
  .avatar.md { width: 44px; height: 44px; font-size: 20px; box-shadow: 0 0 0 2px var(--accent-soft), 0 0 18px rgba(139, 92, 246, .35); }
  .avatar.xl { width: 96px; height: 96px; font-size: 42px; box-shadow: 0 0 0 4px var(--accent-soft), 0 0 40px rgba(139, 92, 246, .45); }

  /* Sidebar */
  .sidebar {
    width: 280px; flex: none; background: var(--sidebar); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 14px; gap: 12px; transition: transform .3s ease;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 4px 8px; }
  .brand b { font-size: 15px; font-weight: 800; letter-spacing: .3px; }
  .brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
  .new-chat {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; font-weight: 600; font-size: 14px;
    background: linear-gradient(135deg, var(--accent), #6D3FE0); color: #fff; box-shadow: 0 6px 18px rgba(139, 92, 246, .35);
    transition: transform .15s, box-shadow .15s;
  }
  .new-chat:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(139, 92, 246, .45); }
  .side-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; padding: 6px 6px 0; }
  .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .chat-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; color: var(--text);
    cursor: pointer; transition: background .15s;
  }
  .chat-item:hover { background: var(--accent-soft); }
  .chat-item.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
  .chat-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item .del { opacity: 0; color: var(--muted); padding: 4px 6px; border-radius: 6px; font-size: 12px; }
  .chat-item:hover .del, .chat-item.active .del { opacity: 1; }
  .chat-item .del:hover { color: #ef4444; background: rgba(239, 68, 68, .12); }
  .empty-list { font-size: 13px; color: var(--muted); padding: 10px 12px; }
  .side-foot { font-size: 11.5px; color: var(--muted); padding: 8px 6px 0; border-top: 1px solid var(--border); line-height: 1.5; }
  .side-foot b { color: var(--accent); }
  .overlay { display: none; }

  /* Main */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100dvh; }
  .topbar {
    position: sticky; top: 0; z-index: 20; flex: none; display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); transition: background .15s, color .15s; font-size: 16px;
  }
  .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
  #menuBtn { display: none; }
  .ai-title { display: flex; flex-direction: column; line-height: 1.15; }
  .ai-title strong { font-size: 22px; font-weight: 800; letter-spacing: .3px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 2px; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse 2s infinite; }
  .spacer { flex: 1; }

  .messages { flex: 1; overflow-y: auto; scroll-behavior: smooth; padding: 24px 16px 12px; }
  .thread { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  /* Welcome */
  .welcome { max-width: 800px; margin: 0 auto; text-align: center; padding: 32px 0 10px; animation: rise .5s ease both; }
  .welcome .avatar { margin-bottom: 18px; }
  .welcome h1 {
    font-size: clamp(26px, 5vw, 38px); font-weight: 800; letter-spacing: -.5px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .welcome p { color: var(--muted); max-width: 540px; margin: 12px auto 0; line-height: 1.6; font-size: 15px; }
  .tagline { margin-top: 14px; font-size: 12.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 28px; text-align: left; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px;
    box-shadow: var(--shadow); transition: transform .18s, border-color .18s, box-shadow .18s; color: var(--text);
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 12px 34px rgba(139, 92, 246, .22); }
  .card i { color: var(--accent); font-size: 18px; }
  .card b { font-size: 14px; }
  .card span { font-size: 12.5px; color: var(--muted); line-height: 1.45; }

  /* Messages */
  .msg { display: flex; gap: 12px; animation: rise .3s ease both; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: min(80%, 620px); background: var(--user-bubble); padding: 12px 16px; border-radius: 18px 18px 4px 18px;
    font-size: 15px; line-height: 1.6; word-wrap: break-word; overflow-wrap: anywhere;
  }
  .ai-body { flex: 1; min-width: 0; }
  .ai-content { font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; }
  .ai-content p { margin: 0 0 10px; }
  .ai-content h1, .ai-content h2, .ai-content h3, .ai-content h4 { margin: 16px 0 8px; line-height: 1.3; }
  .ai-content h1 { font-size: 22px; } .ai-content h2 { font-size: 19px; } .ai-content h3 { font-size: 16.5px; } .ai-content h4 { font-size: 15px; }
  .ai-content ul, .ai-content ol { margin: 0 0 10px 22px; }
  .ai-content li { margin: 3px 0; }
  .ai-content strong { font-weight: 700; }
  .ai-content a { color: var(--accent); }
  .ai-content code {
    font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 13px; background: var(--accent-soft);
    color: var(--accent); padding: 2px 6px; border-radius: 6px;
  }
  .msg.error .ai-content { color: #ef4444; background: rgba(239, 68, 68, .08); padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(239, 68, 68, .25); }

  .code-block { margin: 12px 0; border-radius: 14px; overflow: hidden; background: var(--code-bg); border: 1px solid rgba(255, 255, 255, .06); }
  .code-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: var(--code-head); font-size: 12px; color: #98A2B8; }
  .code-head span { font-weight: 600; text-transform: lowercase; letter-spacing: .4px; color: var(--accent-2); }
  .copy-code { color: #98A2B8; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; padding: 4px 8px; border-radius: 6px; }
  .copy-code:hover { background: rgba(255, 255, 255, .08); color: #fff; }
  .code-block pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
  .code-block pre code { background: none; color: var(--code-text); padding: 0; font-size: 13px; line-height: 1.6; white-space: pre; }

  .actions { display: flex; align-items: center; gap: 4px; margin-top: 8px; color: var(--muted); font-size: 13px; }
  .act {
    height: 30px; min-width: 30px; padding: 0 8px; border-radius: 8px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; transition: background .15s, color .15s;
  }
  .act:hover { background: var(--accent-soft); color: var(--accent); }
  .act.active { color: var(--accent); background: var(--accent-soft); }
  .act.down.active { color: #ef4444; background: rgba(239, 68, 68, .12); }
  .time { font-size: 12px; margin: 0 6px; }

  .typing { display: inline-flex; gap: 5px; padding: 14px 4px; }
  .typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; background: #7C8BF2; }
  .typing i:nth-child(3) { animation-delay: .3s; background: var(--accent-2); }

  /* Composer */
  .composer-wrap { flex: none; padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); }
  .composer {
    max-width: 800px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 22px; padding: 8px 8px 8px 18px; box-shadow: var(--shadow);
    transition: border-color .2s, box-shadow .2s;
  }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
  .composer textarea {
    flex: 1; border: none; outline: none; resize: none; background: transparent; color: var(--text);
    font: inherit; font-size: 15px; line-height: 1.5; max-height: 200px; padding: 8px 0;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .send {
    width: 42px; height: 42px; border-radius: 50%; flex: none; color: #fff; font-size: 15px;
    background: linear-gradient(135deg, var(--accent), #6D3FE0); box-shadow: 0 6px 16px rgba(139, 92, 246, .4); transition: transform .15s, opacity .2s;
  }
  .send:hover:not(:disabled) { transform: scale(1.07); }
  .send:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-6px); opacity: 1; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

  @media (max-width: 820px) {
    .sidebar { position: fixed; z-index: 50; top: 0; bottom: 0; left: 0; transform: translateX(-100%); box-shadow: var(--shadow); }
    .sidebar.open { transform: none; }
    .overlay.show { display: block; position: fixed; inset: 0; z-index: 40; background: rgba(5, 8, 20, .55); backdrop-filter: blur(2px); }
    #menuBtn { display: inline-flex; }
    .topbar { padding: 8px 12px; }
    .ai-title strong { font-size: 20px; }
    .cards { grid-template-columns: 1fr; }
    .bubble { max-width: 88%; }
    .msg { gap: 10px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand" id="brandBox">
      <div>
        <b>VEX NEXORA</b>
        <small>by VEX Creative Designs</small>
      </div>
    </div>
    <button class="new-chat" id="newChat"><i class="fa-solid fa-plus"></i> New chat</button>
    <div class="side-title">Recent chats</div>
    <div class="chat-list" id="chatList"></div>
    <div class="side-foot"><b>Your Ideas. Your Code. Your Future.</b><br />© VEX Creative Designs</div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      <span id="topAvatar"></span>
      <div class="ai-title">
        <strong>NEXORA AI</strong>
        <span class="status"><i></i> Online</span>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="logoutBtn" aria-label="Sign out" title="Sign out"><i class="fa-solid fa-right-from-bracket"></i></button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
    </header>

    <section class="messages" id="messages"></section>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Ask NEXORA AI to build, debug or teach code..."></textarea>
        <button class="send" id="sendBtn" disabled aria-label="Send"><i class="fa-solid fa-arrow-up"></i></button>
      </div>
      <div class="note">NEXORA AI can make mistakes.</div>
    </div>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
